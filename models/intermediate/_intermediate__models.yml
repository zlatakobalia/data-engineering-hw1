version: 2

models:
  - name: int_orders_with_payments
    description: >
      Одна строка — один заказ (включая тестовые), к нему пристыкованы итоги по платежам и позициям.
      Платежи и позиции сначала свёрнуты до заказа, потом присоединены left join: заказ без платежей не теряется,
      а заказ с двумя платежами не раздваивается.
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: items_count
        description: "Число разных товаров в заказе."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: first_paid_at
        description: "Время первой успешной оплаты."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
      - name: success_operations_count
        description: "Число операций в статусе success, включая возвраты."
      - name: failed_operations_count
        description: "Число неуспешных операций."
      - name: pending_operations_count
        description: "Число операций в ожидании."

  - name: int_product_categories_tree
    description: >
      Развёрнутое дерево категорий: одна строка — одна категория, к ней пристыкованы родитель, корень,
      уровень и путь вида Home > Kitchen > Cookware. Строится рекурсивным CTE (with recursive),
      поэтому не зависит от глубины дерева.
    columns:
      - name: category_id
        description: "Номер категории."
        data_tests: [unique, not_null]
      - name: category_name
        description: "Название категории."
        data_tests: [unique, not_null]
      - name: parent_category_name
        description: "Название родительской категории; пусто у корневой."
      - name: root_category_name
        description: "Корень дерева, верхний уровень: Electronics или Home."
        data_tests: [not_null]
      - name: category_level
        description: "Глубина: 1 — корень, 2 — подкатегория, 3 — подкатегория подкатегории."
      - name: category_path
        description: "Полный путь от корня через ' > '."

  - name: int_customer_orders
    description: >
      Одна строка — один клиент, у которого есть заказы (без тестовых): число заказов,
      подтверждённые покупки, выручка и первая подтверждённая покупка.
    columns:
      - name: customer_id
        description: "Номер клиента."
        data_tests: [unique, not_null]
      - name: orders_count
        description: "Число заказов клиента без тестовых, в любом статусе."
      - name: confirmed_orders_count
        description: "Число подтверждённых покупок."
      - name: confirmed_revenue
        description: "Сумма подтверждённых покупок."
      - name: first_confirmed_order_id
        description: "Первая подтверждённая покупка: самая ранняя по времени, при равенстве — с меньшим номером."
      - name: first_confirmed_at
        description: "Время оформления первой подтверждённой покупки."
