version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка - один заказ. Тестовые заказы исключены.
      Отвечает на вопросы о заказах целиком: выручка и число подтверждённых покупок по дням и месяцам,
      средний чек по городам и каналам (через dim_customers), оплаты и возвраты.
      Хранение: distributed by (order_id), строчная heap-таблица.
    columns:
      - name: order_id
        description: "Номер заказа. Первичный ключ."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ. Ключ на dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа. Ключ на dim_dates."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled. Тестовых (test) в витрине нет."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        description: "Сумма заказа в рублях после скидок. Равна сумме line_amount его позиций в fct_order_items."
        data_tests: [not_null, non_negative]
      - name: items_count
        description: "Число разных товаров в заказе."
        data_tests: [not_null, non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат с положительной суммой; 0, если оплат нет."
        data_tests: [not_null, non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
        data_tests: [not_null, non_negative]
      - name: net_paid_amount
        description: "Оплачено минус возвращено. У возвращённого заказа должно быть 0."
      - name: successful_payments_count
        description: "Число успешных оплат с положительной суммой: возвраты и нулевые операции не считаются."
        data_tests: [non_negative]
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: fct_order_items
    description: >
      Факт позиций заказа: одна строка - один товар в заказе. Позиции тестовых заказов исключены.
      Отвечает на вопросы на уровне товара: выручка по месяцам и категориям, бренды и возвраты
      (через dim_products), выручка по каналам и городам (через dim_customers).
      Инкрементальная модель (delete+insert по order_item_id), хранение: distributed by (order_id),
      колоночная append-optimized таблица.
    columns:
      - name: order_item_id
        description: "Ключ позиции вида 101-1: номер заказа и номер товара через дефис. Первичный ключ."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Заказ. Ключ на fct_orders (вырожденное измерение)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Товар. Ключ на dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Клиент, оформивший заказ. Ключ на dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа. Ключ на dim_dates."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа. По нему инкрементальная модель выбирает новые заказы."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: quantity
        description: "Количество единиц товара."
        data_tests: [not_null, non_negative]
      - name: unit_price
        description: "Цена за единицу до скидки, в рублях."
        data_tests: [not_null, non_negative]
      - name: discount_amount
        description: "Скидка на всю позицию в рублях."
        data_tests: [not_null, non_negative]
      - name: gross_amount
        description: "Сумма позиции до скидки: quantity × unit_price."
        data_tests: [non_negative]
      - name: line_amount
        description: "Сумма позиции после скидки: gross_amount − discount_amount. Основная мера выручки."
        data_tests: [not_null, non_negative]
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }} Признак заказа, повторён на каждой его позиции.'
        data_tests: [not_null]

  - name: dim_customers
    description: >
      Измерение клиентов: одна строка - один клиент, включая тех, кто ничего не купил.
      Отвечает на вопросы о покупателях: доля покупателей по каналам привлечения, средний чек и выручка по городам,
      когда клиент сделал первую покупку. Хранение: distributed replicated.
    columns:
      - name: customer_id
        description: "Номер клиента. Первичный ключ."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Время регистрации."
        data_tests: [not_null]
      - name: registration_date
        description: "Дата регистрации без времени."
      - name: city
        description: "Город клиента."
        data_tests: [not_null]
      - name: acquisition_channel
        description: "Канал привлечения: search, email, organic, social, ads, partner."
        data_tests: [not_null]
      - name: orders_count
        description: "Число заказов клиента в любом статусе, без тестовых."
        data_tests: [non_negative]
      - name: first_ordered_at
        description: "Время первого заказа в любом статусе; пусто, если заказов нет."
      - name: first_confirmed_order_id
        description: >
          Первая подтверждённая покупка: самый ранний по времени оформления подтверждённый заказ,
          при одинаковом времени - с меньшим номером. Пусто, если покупок нет.
      - name: first_confirmed_at
        description: "Время оформления первой подтверждённой покупки; пусто, если покупок нет."
      - name: confirmed_orders_count
        description: "Число подтверждённых покупок клиента."
        data_tests: [not_null, non_negative]
      - name: confirmed_revenue
        description: "Сумма подтверждённых покупок клиента (order_amount), в рублях; 0, если покупок нет."
        data_tests: [not_null, non_negative]
      - name: is_buyer
        description: "Покупатель: есть хотя бы одна подтверждённая покупка."
        data_tests: [not_null]

  - name: dim_products
    description: >
      Измерение товаров: одна строка - один товар с брендом и полной иерархией категорий.
      Отвечает на вопросы о товарах: выручка по категориям любого уровня, какие бренды чаще возвращают.
      Хранение: distributed replicated.
    columns:
      - name: product_id
        description: "Номер товара. Первичный ключ."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд."
        data_tests: [not_null]
      - name: category_id
        description: "Номер категории товара."
        data_tests: [not_null]
      - name: category_name
        description: "Категория товара - самый нижний уровень, к которому он отнесён (например, Cookware)."
        data_tests: [not_null]
      - name: parent_category_name
        description: "Родитель категории товара (например, Kitchen); пусто, если товар лежит прямо в корне."
      - name: root_category_name
        description: "Верхний уровень дерева: Electronics или Home."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Electronics', 'Home']
      - name: category_level
        description: "Глубина категории товара: 1 - корень, 2, 3 - ниже."
      - name: category_path
        description: "Полный путь категории, например Home > Kitchen > Cookware."

  - name: dim_dates
    description: >
      Календарь: одна строка - один день, без пропусков от первой до последней даты заказа, включая тестовые заказы.
      Отвечает на вопросы по времени: выручка по годам, кварталам, месяцам, дням недели, будни и выходные.
      Хранение: distributed replicated.
    columns:
      - name: date_day
        description: "День. Первичный ключ, на него ссылаются order_date фактов."
        data_tests: [unique, not_null]
      - name: year
        description: "Год."
      - name: quarter
        description: "Квартал, 1-4."
      - name: month
        description: "Номер месяца, 1-12."
      - name: month_name
        description: "Название месяца по-английски: March, April…"
      - name: year_month
        description: "Год и месяц в виде 2026-03 - удобно группировать выручку по месяцам."
      - name: iso_week
        description: "Номер недели года по ISO 8601."
      - name: day_of_month
        description: "День месяца, 1-31."
      - name: day_of_week
        description: "День недели по ISO: 1 - понедельник, 7 - воскресенье."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: day_of_week_name
        description: "Название дня недели по-английски: Monday…"
      - name: is_weekend
        description: "Выходной: суббота или воскресенье."
        data_tests: [not_null]
